<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC Control — VM2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header>
      <h1>Minecraft VM2 Control</h1>
      <p class="subtitle">Daily OCPU-hour budget &amp; wake orchestration</p>
    </header>

    <section id="exhausted-banner" class="banner hidden" role="alert">
      Daily budget exhausted — wake blocked until reset.
    </section>

    <section class="status-grid">
      <div class="card">
        <h2>Door state</h2>
        <p id="door" class="value">—</p>
      </div>
      <div class="card">
        <h2>Remaining today</h2>
        <p id="remaining" class="value">—</p>
        <p id="used" class="meta"></p>
      </div>
      <div class="card">
        <h2>Resets (LA midnight)</h2>
        <p id="reset" class="value small">—</p>
      </div>
      <div class="card">
        <h2>Keepalive</h2>
        <p id="keepalive" class="value small">—</p>
      </div>
    </section>

    <section class="actions">
      <button id="wake-btn" type="button">Wake primary VM</button>
      <p id="action-msg" class="meta" aria-live="polite"></p>
    </section>

    <section class="config">
      <h2>Idle timeout</h2>
      <form id="idle-form">
        <label for="idle-minutes">Empty-server minutes before stop</label>
        <div class="row">
          <input id="idle-minutes" name="idle-minutes" type="number" min="1" max="1440" value="15">
          <button type="submit">Save</button>
        </div>
      </form>
    </section>

    <footer>
      <p class="meta">Protected by network allowlist only (Phase A).</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
