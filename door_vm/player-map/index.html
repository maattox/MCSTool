<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161310">
  <title>Map</title>
  <style>
    :root {
      --void: #161310;
      --binding: #2A2218;
      --item: #E8DCC0;
      --quiet: #9A8E78;
      --well: #1A1510;
      --bevel-dark: #0A0907;
      --bevel-light: #5C4E3C;
      --font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: dark; height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--void);
      color: var(--item);
      font-family: var(--font);
    }
    .shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
    }
    .bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "title tabs note";
      align-items: center;
      gap: 10px 16px;
      padding: 8px 14px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: var(--binding);
      border-bottom: 1px solid var(--bevel-dark);
      box-shadow: inset 0 1px 0 #3D3428;
    }
    .brand {
      grid-area: title;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--item);
    }
    .dims {
      grid-area: tabs;
      display: flex;
      gap: 4px;
    }
    .note {
      grid-area: note;
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      color: var(--quiet);
      text-align: right;
    }
    .slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      height: 32px;
      background: var(--well);
      color: var(--quiet);
      font-size: 13px;
      font-weight: 500;
      box-shadow:
        inset 2px 2px 0 var(--bevel-dark),
        inset -2px -2px 0 var(--bevel-light);
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .stage p {
      margin: 0;
      max-width: 36rem;
      font-size: 15px;
      line-height: 1.45;
      color: var(--item);
      text-align: center;
    }
    @media (max-width: 639px) {
      .bar {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "title note"
          "tabs tabs";
      }
      .note { text-align: left; }
      .dims { display: grid; grid-template-columns: 1fr 1fr 1fr; }
      .slot { height: 44px; min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <h1 class="brand">Map</h1>
      <nav class="dims" aria-label="Dimension">
        <span class="slot" aria-disabled="true">Overworld</span>
        <span class="slot" aria-disabled="true">Nether</span>
        <span class="slot" aria-disabled="true">End</span>
      </nav>
      <p class="note">Explored terrain only</p>
    </header>
    <main class="stage">
      <p>Map is not ready yet. Explored terrain appears here after the first update.</p>
    </main>
  </div>
</body>
</html>
